<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cover Image Full Width at Very Top -->
    <img src="images/Pembe Günbatımında Kedi Astronot.png" alt="Panoramic view of an astronaut cat sitting on a cliff overlooking mountains and a lake at pink sunset, surrounded by books, a vinyl record player, headphones, and a soccer ball" class="cover-image">

    <!-- Heading with Small Mascot Next to It -->
    <header class="header-section">
        <div class="heading-container">
            <img src="images/Neon Pembe Astronot Kedi Kolajı.png" alt="Astronaut cat mascot standing in a spacesuit against a pink torn paper background" class="mascot-img">
            <h1>Welcome to My Space</h1>
        </div>
    </header>

    <main>
        <!-- My Interests Section with Three Cards -->
        <section class="interests-section">
            <h2>My interests</h2>
            <div class="cards-grid">
                <div class="card">
                    <img src="images/Pembe Kitap Okuyan Astronot Kedi.png" alt="Astronaut cat in a space helmet resting its chin on its paw while reading an open pink book">
                    <div class="card-content">
                        <h3>Reading</h3>
                    </div>
                </div>
                <div class="card">
                    <img src="images/Neon Pembe Kulaklıklı Müziksever Kedi.png" alt="Cat wearing neon pink headphones with paws resting on a retro vinyl record player">
                    <div class="card-content">
                        <h3>Music</h3>
                    </div>
                </div>
                <div class="card">
                    <img src="images/Neon Pembe Uzay Kedisiyle Futbol.png" alt="Astronaut cat in a space suit kicking a soccer ball across a grassy field">
                    <div class="card-content">
                        <h3>Sports</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Note -->
    <footer>
        <p class="ai-note"><small>The images on this site were made with AI.</small></p>
    </footer>

</body>
</html>
